<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TMade Alex's AstroLog</title>
<meta name="description" content="Everything done to TMade Alex's home on GitHub, in plain words. The first build is on its way.">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark light">
<style>
  :root { --bg:#0c1719; --ink:#e6fafa; --soft:#9fbfc0; --accent:#5fe0e3; }
  @media (prefers-color-scheme: light) { :root { --bg:#c2e6e7; --ink:#0c1719; --soft:#24474a; --accent:#155a5d; } }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--ink); font:17px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 34rem; padding: 0 16px; text-align:center; }
  h1 { font-size: clamp(1.7rem, 5vw, 2.3rem); margin: 0 0 .5rem; }
  h1 span { color: var(--accent); }
  p { color: var(--soft); margin: 0 0 1rem; }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>TMade Alex's AstroLog<span>.</span></h1>
  <p>Everything done to his home, in plain words. The first build is on its way.</p>
  <p>Meanwhile, his own site: <a href="https://tmadealex.github.io/">tmadealex.github.io</a>.</p>
  <p><small>A member of TMade Alex's community set this home up as a gift. TMade Alex decides what stays.</small></p>
</main>
</body>
</html>
